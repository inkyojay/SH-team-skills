<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080, initial-scale=1">
<title>SundayHug Live Thumbnail</title>
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
* { box-sizing: border-box; }
html, body {
  margin: 0;
  width: 1080px;
  height: 1080px;
  overflow: hidden;
  background: #111518;
  font-family: Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
}
.sh-live-thumb {
  position: relative;
  width: 1080px;
  height: 1175px;
  overflow: hidden;
  background: #111518;
}
.bg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: var(--bg-position, 50% 0%);
  filter: brightness(.88) contrast(.96) saturate(.92);
}
.warm-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(0,0,0,.10) 0%, rgba(0,0,0,.10) 45%, rgba(0,0,0,.18) 100%);
}
.schedule {
  position: absolute;
  left: 75px;
  top: 626px;
  width: 545px;
  height: 75px;
  display: block;
  border-radius: 38px;
  background: #111518;
  box-shadow: 0 5px 13px rgba(0,0,0,.25);
}
.live-label {
  position: absolute;
  left: 57px;
  top: 14px;
  width: 71px;
  height: 48px;
}
.live-label img {
  display: block;
  width: 71px;
  height: 48px;
  object-fit: contain;
}
.date {
  position: absolute;
  left: 148px;
  top: 0;
  height: 75px;
  display: flex;
  align-items: center;
  color: #fff;
  font-size: 40px;
  font-weight: 850;
  letter-spacing: -.8px;
  white-space: nowrap;
}
.kicker {
  position: absolute;
  left: 94px;
  top: 726px;
  color: rgba(255,255,255,.82);
  font-size: 18px;
  font-weight: 900;
  letter-spacing: .18em;
  text-transform: uppercase;
  text-shadow: 0 2px 6px rgba(0,0,0,.24);
}
.title {
  position: absolute;
  left: 94px;
  top: 764px;
  color: #fff;
  font-size: 65px;
  font-weight: 900;
  line-height: 1.35;
  letter-spacing: -2.7px;
  text-shadow: 0 3px 6px rgba(0,0,0,.38), 0 7px 14px rgba(0,0,0,.18);
}
</style>
</head>
<body>
<div class="sh-live-thumb">
  <img class="bg" src="{{BACKGROUND_SRC}}" alt="">
  <div class="warm-overlay"></div>

  <div class="schedule">
    <div class="live-label"><img src="{{LIVE_BADGE_SRC}}" alt="LIVE"></div>
    <div class="date">{{DATE_TEXT}}</div>
  </div>

  <div class="kicker">{{KICKER_TEXT}}</div>
  <div class="title">{{TITLE_LINE_1}}<br>{{TITLE_LINE_2}}</div>
</div>
</body>
</html>
